<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffb6cf">
    <title>授权登录到客户端</title>
    <style>
        :root {
            --pink: #ffb6cf;
            --text: #2f2a2d;
            --muted: #7d7479;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(160deg, #fff5f8 0%, #ffe9f1 45%, #f7e7ff 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            -webkit-text-size-adjust: 100%;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 182, 207, 0.5);
            border-radius: 20px;
            padding: 28px 24px 24px;
            box-shadow: 0 12px 40px rgba(196, 120, 155, 0.16);
        }

        h1 {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 6px;
        }

        .sub {
            font-size: 13px;
            line-height: 1.7;
            color: var(--muted);
            margin: 0 0 20px;
        }

        .state {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff6fa;
            border: 1px solid rgba(255, 182, 207, 0.45);
            margin-bottom: 18px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1d9e75;
            flex: none;
        }

        .dot.off {
            background: #e24b4a;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: 13px;
            background: var(--pink);
            color: #4b2030;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(255, 182, 207, 0.5);
        }

        .btn.ghost {
            background: #fff;
            border: 1px solid rgba(255, 182, 207, 0.7);
            color: var(--text);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        details {
            margin-top: 18px;
            font-size: 12px;
            color: var(--muted);
        }

        summary {
            cursor: pointer;
            user-select: none;
        }

        textarea {
            width: 100%;
            height: 84px;
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
            line-height: 1.5;
            resize: vertical;
            word-break: break-all;
            background: #fbfafb;
            color: #444;
        }

        .warn {
            margin-top: 18px;
            font-size: 12px;
            line-height: 1.7;
            color: #a04a5f;
            background: #fff2f5;
            border-radius: 10px;
            padding: 10px 12px;
        }

        a {
            color: #c2456b;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>授权登录到客户端</h1>
        <p class="sub">这个页面会把你当前的登录状态交给桌面客户端或手机 App，省去在客户端里再登录一次。</p>

        <div class="state">
            <span class="dot off" id="dot"></span>
            <span id="stateText">正在检查登录状态…</span>
        </div>

        <button class="btn" id="grantBtn" style="display:none;">授权给客户端</button>
        <button class="btn ghost" id="loginBtn" style="display:none;">先去登录</button>

        <details id="manualBox" style="display:none;">
            <summary>客户端没有自动跳转？手动复制凭证</summary>
            <textarea id="tokenBox" readonly></textarea>
        </details>

        <div class="warn">
            授权链接里包含你的登录凭证。别截图、别发给别人；如果泄露，去站点退出登录即可让旧凭证失效。
        </div>
    </main>

    <script>
        (function () {
            var dot = document.getElementById('dot');
            var stateText = document.getElementById('stateText');
            var grantBtn = document.getElementById('grantBtn');
            var loginBtn = document.getElementById('loginBtn');
            var manualBox = document.getElementById('manualBox');
            var tokenBox = document.getElementById('tokenBox');

            var token = '';
            try { token = localStorage.getItem('token') || ''; } catch (e) { token = ''; }

            if (!token) {
                dot.className = 'dot off';
                stateText.textContent = '当前浏览器还没登录';
                loginBtn.style.display = 'block';
                loginBtn.onclick = function () { location.href = '/'; };
                return;
            }

            dot.className = 'dot';
            stateText.textContent = '已登录，可以授权了';
            grantBtn.style.display = 'block';
            tokenBox.value = token;
            manualBox.style.display = 'block';

            grantBtn.onclick = function () {
                var url = 'taffy://auth?token=' + encodeURIComponent(token);
                stateText.textContent = '正在唤起客户端…';
                grantBtn.disabled = true;

                var iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = url;
                document.body.appendChild(iframe);
                setTimeout(function () { document.body.removeChild(iframe); }, 1500);

                setTimeout(function () {
                    grantBtn.disabled = false;
                    stateText.textContent = '如果客户端没有反应，展开下面的手动方式';
                    manualBox.open = true;
                }, 2200);
            };
        })();
    </script>
</body>

</html>
